# CI for atlas-pr-diff itself. (The files under github/ are templates for
# users to copy into *their* app repos; this workflow only tests this repo.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    # Pinned (not ubuntu-latest): ubuntu-latest is now 26.04, and
    # actions/setup-python publishes no Python 3.9 build for it. 24.04 has
    # every version in the matrix below.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Mirrors requires-python / the classifiers in pyproject.toml.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python -m compileall -q atlas_diff github

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test (no install)
        run: |
          ./atlas-diff --help >/dev/null
          python -m atlas_diff --help >/dev/null
          python github/post_check.py --help >/dev/null

      - name: Package install smoke test
        run: |
          python -m pip install --quiet .
          atlas-diff --help >/dev/null
          atlas-diff diff --help >/dev/null
